spring:
  application:
    name: danuri-admin

  datasource:
    url: jdbc:postgresql://localhost:5432/danuri_db
    username: danuri
    password: danuri_password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  thymeleaf:
    cache: false
    prefix: classpath:/templates/
    suffix: .html

server:
  port: 8080
  servlet:
    context-path: /admin

logging:
  level:
    root: INFO
    kr.go.danuri: DEBUG
    org.springframework.security: DEBUG

# Custom properties
danuri:
  api:
    url: http://localhost:3030
  jwt:
    secret: ${JWT_SECRET:your-secret-key}
