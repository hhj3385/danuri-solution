# DANURI ITSM Admin Console - Application Configuration
# WARNING: Do NOT hardcode sensitive values. Use environment variables.

spring:
  application:
    name: danuri-admin-console
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  # Database Configuration (Environment Variables Required)
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/danuri_itsm}
    username: ${SPRING_DATASOURCE_USERNAME:danuri}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  # JPA Configuration
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: Asia/Seoul

  # Thymeleaf Configuration (Local Templates Only)
  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    mode: HTML
    encoding: UTF-8
    cache: ${THYMELEAF_CACHE:true}

  # Security Configuration
  security:
    require-ssl: true

  # Servlet Configuration
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 100MB

# Server Configuration
server:
  port: ${ADMIN_CONSOLE_PORT:8080}
  servlet:
    context-path: /admin
    session:
      timeout: 30m
      cookie:
        secure: true
        http-only: true
        same-site: strict
  error:
    include-stacktrace: never
    include-message: never

# Actuator Configuration (Restricted for Security)
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

# Logging Configuration
logging:
  level:
    root: INFO
    kr.go.danuri: DEBUG
    org.springframework.security: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: ${LOG_PATH:./logs}/admin-console.log

# eGovFrame Configuration
egovframework:
  message:
    locale: ko_KR
